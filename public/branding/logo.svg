<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="100%">
  <defs>
    <!-- R Gradient: Crimson Ruby into warm coral-gold -->
    <linearGradient id="rcRGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#C52233" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- C Gradient: Deep Marine Teal into bright Medical Cyan -->
    <linearGradient id="rcCGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008080" />
      <stop offset="50%" stop-color="#00A6A6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Accent Line Gradient: Gold to Teal -->
    <linearGradient id="rcLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#E5A93C" />
      <stop offset="80%" stop-color="#00A6A6" />
      <stop offset="100%" stop-color="#0B3C5D" />
    </linearGradient>

    <!-- Pharma Script Gradient: Amber Gold to Warm Crimson -->
    <linearGradient id="rcPharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Monogram Interlocking RC -->
  <g transform="translate(190, 72)" text-anchor="middle">
    <!-- Letter R (Serif Italic with subtle drop shadow) -->
    <text
      x="-18"
      y="18"
      font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
      font-size="68"
      font-weight="800"
      font-style="italic"
      fill="url(#rcRGrad)"
      stroke="#991B1B"
      stroke-width="0.8"
    >R</text>

    <!-- Letter C (Interlocking around R) -->
    <text
      x="16"
      y="26"
      font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
      font-size="62"
      font-weight="800"
      font-style="italic"
      fill="url(#rcCGrad)"
      stroke="#006666"
      stroke-width="0.8"
    >C</text>
  </g>

  <!-- Wordmark: REX CURE -->
  <text
    x="190"
    y="156"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="4"
    fill="#0B3C5D"
  >
    <tspan fill="#008080">REX</tspan>
    <tspan dx="8" fill="#0B3C5D">CURE</tspan>
  </text>

  <!-- Horizontal Accent Bar -->
  <rect
    x="45"
    y="168"
    width="290"
    height="3.5"
    rx="1.75"
    fill="url(#rcLineGrad)"
  />

  <!-- Script: Pharma -->
  <text
    x="315"
    y="208"
    text-anchor="end"
    font-family="'Brush Script MT', 'Caveat', 'Great Vibes', cursive, 'Times New Roman', serif"
    font-size="40"
    font-weight="bold"
    font-style="italic"
    fill="url(#rcPharmaGrad)"
    stroke="#92400E"
    stroke-width="0.4"
  >Pharma</text>
</svg>
